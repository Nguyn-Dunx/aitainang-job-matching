# T1: chỉ DB cho dev local. T4 sẽ thêm service api + deploy thật.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: aitainang-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aitainang
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aitainang"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
